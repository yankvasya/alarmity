name: Build Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: alarmity-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Determine version
        id: version
        run: |
          echo "name=0.1.${{ github.run_number }}-alpha" >> "$GITHUB_OUTPUT"
          echo "tag=v0.1.${{ github.run_number }}-alpha" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"

          # `|| true` after each grep: with pipefail (the default for Actions run steps), a grep
          # that matches nothing (e.g. no fix: commits this release) would otherwise abort the step.
          ADDED=$(git log "$RANGE" --pretty=format:'%s' --no-merges | { grep -E '^feat(\(.+\))?!?:' || true; } | sed -E 's/^feat(\(.+\))?!?: */- /')
          FIXED=$(git log "$RANGE" --pretty=format:'%s' --no-merges | { grep -E '^fix(\(.+\))?!?:' || true; } | sed -E 's/^fix(\(.+\))?!?: */- /')
          CHANGED=$(git log "$RANGE" --pretty=format:'%s' --no-merges | { grep -vE '^(feat|fix)(\(.+\))?!?:' || true; } | sed -E 's/^[a-z]+(\(.+\))?!?: */- /')

          DELIM="CHANGELOG_$(date +%s%N)"
          {
            echo "changelog<<$DELIM"
            [ -n "$ADDED" ] && printf '### Added\n%s\n\n' "$ADDED"
            [ -n "$FIXED" ] && printf '### Fixed\n%s\n\n' "$FIXED"
            [ -n "$CHANGED" ] && printf '### Changed\n%s\n\n' "$CHANGED"
            if [ -z "$ADDED$FIXED$CHANGED" ]; then echo "No notable changes."; fi
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.changelog }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk

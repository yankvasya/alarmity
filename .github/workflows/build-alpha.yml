name: Build Alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Determine version and rename APK
        id: version
        run: |
          METADATA=app/build/outputs/apk/debug/output-metadata.json
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$METADATA")
          RELEASE_VERSION=$(echo "$VERSION_NAME" | sed -E 's/-(alpha|dev)$//')
          BUILD=${{ github.run_number }}

          APK_NAME="alarmity-${VERSION_NAME}-${BUILD}.apk"
          mv "app/build/outputs/apk/debug/$(jq -r '.elements[0].outputFile' "$METADATA")" \
             "app/build/outputs/apk/debug/$APK_NAME"

          {
            echo "apk_path=app/build/outputs/apk/debug/$APK_NAME"
            echo "apk_name=$APK_NAME"
            echo "tag=v${VERSION_NAME}-${BUILD}"
            echo "title=Alarmity ${RELEASE_VERSION} (Alpha) — Build ${BUILD}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.version.outputs.apk_path }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"

          # `|| true` after each grep: with pipefail (the default for Actions run steps), a grep
          # that matches nothing (e.g. no fix: commits this release) would otherwise abort the step.
          ADDED=$(git log "$RANGE" --pretty=format:'%s' --no-merges | { grep -E '^feat(\(.+\))?!?:' || true; } | sed -E 's/^feat(\(.+\))?!?: */- /')
          FIXED=$(git log "$RANGE" --pretty=format:'%s' --no-merges | { grep -E '^fix(\(.+\))?!?:' || true; } | sed -E 's/^fix(\(.+\))?!?: */- /')
          CHANGED=$(git log "$RANGE" --pretty=format:'%s' --no-merges | { grep -vE '^(feat|fix)(\(.+\))?!?:' || true; } | sed -E 's/^[a-z]+(\(.+\))?!?: */- /')

          DELIM="CHANGELOG_$(date +%s%N)"
          {
            echo "changelog<<$DELIM"
            [ -n "$ADDED" ] && printf '### Added\n%s\n\n' "$ADDED"
            [ -n "$FIXED" ] && printf '### Fixed\n%s\n\n' "$FIXED"
            [ -n "$CHANGED" ] && printf '### Changed\n%s\n\n' "$CHANGED"
            if [ -z "$ADDED$FIXED$CHANGED" ]; then echo "No notable changes."; fi
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body: ${{ steps.changelog.outputs.changelog }}
          # Not flagged prerelease: alpha status is communicated through the title/version instead.
          # GitHub's "latest release" (and the repo sidebar's release card) explicitly excludes
          # prereleases, so marking these prerelease would mean the repo page never shows one.
          prerelease: false
          files: ${{ steps.version.outputs.apk_path }}
